[project]
name = "aicom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "slack-sdk>=3.27",
    # Ceiling required: mcp 2.0.0 removed mcp.server.fastmcp.FastMCP, which
    # src/aicom/gate/server.py (the sole route to gated actions) imports.
    # Do not relax/bump this past <2.0 until server.py is migrated off
    # mcp.server.fastmcp (e.g. to mcp.server.mcpserver.MCPServer in 2.x).
    "mcp>=1.0,<2.0",
    "pydantic-settings>=2.2",
    "croniter>=2.0",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicom"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "smoke: hits the real claude binary; skipped in CI",
    "browser: drives a real browser; skipped in CI",
]

[tool.mypy]
strict = true
files = ["src/aicom/domain"]

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true
