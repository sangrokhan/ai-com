services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-aicom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicom} -d ${POSTGRES_DB:-aicom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The HTTP process: Slack interaction webhook + REST API + console
  # (src/aicom/inbound/app.py:app_factory).
  #
  # Every route except /slack/interactions, /auth/login, and /health now
  # requires a session cookie (src/aicom/auth/middleware.py). The port is
  # published on the LAN (0.0.0.0), not bound to localhost, so the console
  # can be reached from a phone -- deliberately, per spec §7. It is still
  # served over plain HTTP: the password and session cookie cross the
  # network in clear text, and any device on the LAN can reach the port.
  api:
    build: .
    env_file:
      - .env
    environment:
      AICOM_CONSOLE_PASSWORD: ${AICOM_CONSOLE_PASSWORD}
      AICOM_SESSION_SECRET: ${AICOM_SESSION_SECRET}
      AICOM_SESSION_COOKIE_SECURE: ${AICOM_SESSION_COOKIE_SECURE:-false}
      AICOM_SSE_INTERVAL_SECONDS: ${AICOM_SSE_INTERVAL_SECONDS:-10}
    command:
      [
        "uvicorn",
        "aicom.inbound.app:app_factory",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The worker+sweeper loop (src/aicom/main.py). Spawns the real `claude` CLI
  # as a subprocess, so it needs the host's authenticated Claude session
  # mounted in -- see the README's Docker section for exactly which path and
  # why no credential is baked into the image.
  worker:
    build: .
    env_file:
      - .env
    command: ["python", "-m", "aicom.main"]
    volumes:
      - ${HOME}/.claude:/home/aicom/.claude
      - workspaces:/app/workspaces
      - artifacts:/app/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  workspaces:
  artifacts:
